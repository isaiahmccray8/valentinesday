<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Be My Valentine</title>

<style>
:root{
  --pink1:#ffd1e6;
  --pink2:#ff9fd0;
  --pink3:#ff5fb0;
  --ink:#3b0a24;
}
*{box-sizing:border-box}

/* ✅ BODY CAN SCROLL */
body{
  margin:0;
  min-height:100vh;
  font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 20%, #ffe6f2 0%, rgba(255,230,242,0) 55%),
    radial-gradient(circle at 80% 25%, #ffd0ea 0%, rgba(255,208,234,0) 55%),
    radial-gradient(circle at 50% 80%, #ffb3db 0%, rgba(255,179,219,0) 60%),
    linear-gradient(135deg, var(--pink1), var(--pink2));
}

/* floating background */
.bgFloat{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.wrap{
  max-width:560px;
  margin:40px auto;
  padding:18px;
}

/* ✅ CARD SCROLLS */
.card{
  position:relative;
  max-height:90vh;
  overflow-y:auto;
  border-radius:28px;
  padding:26px 22px 30px;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(10px);
  box-shadow: 0 18px 70px rgba(0,0,0,0.18);
}

/* header */
.top{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.icon{
  width:70px;height:70px;
  border-radius:22px;
  display:grid;
  place-items:center;
  background: linear-gradient(135deg, #ff5fb0, #ffd6ea);
}
.icon span{font-size:30px;color:white}
h1{
  margin:0;
  font-size:24px;
  font-weight:900;
  text-align:center;
}

.verse{
  margin-top:12px;
  text-align:center;
  font-size:13px;
}
.softNote{
  margin-top:10px;
  text-align:center;
  font-size:12px;
  opacity:.7;
}

/* ================= IMAGE SECTION ================= */
.imageSection{
  margin:18px auto 26px;
  display:flex;
  justify-content:center;
}

/* BIGGER HEART */
.heartFrame{
  width:220px;
  aspect-ratio:1/1;
}

.heartShape{
  width:100%;
  height:100%;
  position:relative;
  transform:rotate(-45deg);
  overflow:hidden;
  background:#ffd6ea;
  border-radius:22px;
  box-shadow:0 14px 30px rgba(255,80,150,.25);
}

/* heart curves BEHIND image */
.heartShape::before,
.heartShape::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:#ffd6ea;
  border-radius:50%;
  z-index:0;
}
.heartShape::before{top:-50%}
.heartShape::after{left:50%}

/* ✅ IMAGE ON TOP */
.heartShape img{
  position:absolute;
  inset:-12%;
  width:124%;
  height:124%;
  object-fit:cover;
  object-position:center top;
  transform:rotate(45deg);
  z-index:2;
}

/* ================= BUTTON AREA ================= */
.area{
  margin-top:18px;
  position:relative;
  height:150px;
}

.btn{
  border:0;
  cursor:pointer;
  font-weight:900;
  border-radius:18px;
}
.yes{
  width:170px;
  height:58px;
  font-size:18px;
  color:white;
  background: linear-gradient(135deg, #ff4f9a, #ff9ad5);
  position:absolute;
  left:22px;
  top:56px;
}
.no{
  width:125px;
  height:50px;
  font-size:14px;
  background:white;
  border:2px solid rgba(255,100,170,.45);
  position:absolute;
  left:235px;
  top:62px;
}

.yesScreen{
  display:none;
  margin-top:16px;
  padding:16px;
  border-radius:18px;
  background:#ffe6f2;
  text-align:center;
}
</style>
</head>
